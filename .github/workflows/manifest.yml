name: Update resource manifest
on:
  push:
    branches: [main]
    paths: ["resources/**", "tools/build-manifest.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build-manifest.mjs
      - name: Commit manifest, only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified game resources manifest"
            git push
          fi
